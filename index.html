<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하지은 · 프로필</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    background:linear-gradient(160deg,#1f3a5f,#16293f);color:#fff;min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:40px 20px;}
  .wrap{max-width:760px;width:100%;text-align:center;}
  .eyebrow{letter-spacing:.28em;font-size:12px;font-weight:700;color:#e6c987;margin-bottom:14px;}
  h1{font-size:38px;font-weight:800;margin-bottom:8px;}
  .sub{color:#c3cedb;font-size:15px;margin-bottom:40px;}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media(max-width:620px){.cards{grid-template-columns:1fr;}}
  a.card{display:block;background:rgba(255,255,255,.06);border:1px solid rgba(230,201,135,.35);
    border-radius:18px;padding:34px 26px;text-decoration:none;color:#fff;transition:.18s;}
  a.card:hover{background:rgba(255,255,255,.12);transform:translateY(-3px);}
  a.card .ic{font-size:30px;margin-bottom:12px;}
  a.card h2{font-size:20px;font-weight:800;margin-bottom:6px;color:#e6c987;}
  a.card p{font-size:13.5px;color:#cdd8e6;line-height:1.55;}
  .foot{margin-top:34px;font-size:12px;color:#8ea0b6;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">HA JIEUN · PROFILE</div>
    <h1>하지은</h1>
    <div class="sub">대학교수 · 베스트셀러 작가 · 라이프&amp;커리어 멘토 · 창업가</div>
    <div class="cards">
      <a class="card" href="growth.html">
        <div class="ic">🌱</div>
        <h2>성장과정</h2>
        <p>비서에서 대학교수까지 — 스스로 설계한 25년의 궤적</p>
      </a>
      <a class="card" href="brand.html">
        <div class="ic">✦</div>
        <h2>퍼스널 브랜드</h2>
        <p>강점 진단 · 성취 · 강연/컨설팅 프로필</p>
      </a>
    </div>
    <div class="foot">"생각이 현실이 되는 삶"</div>
  </div>
</body>
</html>
